<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Follet</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/roboto-flex/full.css">
<link rel="stylesheet" href="../../node_modules/material-symbols/rounded.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/notch.css">
</head>
<body>
<div id="notch" data-mode="collapsed">
  <!-- replie / apercu -->
  <div id="compact">
    <img class="c-art" alt="" title="Ouvrir le lecteur">
    <div class="c-mascot"></div>
    <div class="c-mid">
      <div class="c-title"></div>
      <div class="c-sub"></div>
      <div class="c-lyric" data-noi18n></div>
    </div>
    <div class="c-right">
      <div class="eq"><i></i><i></i><i></i><i></i></div>
      <span class="c-mic" title="Micro utilisé"></span>
      <span class="c-timer"><span class="ms fill">timer</span><span class="c-timer-val"></span></span>
      <div class="c-ctrl">
        <button class="icon-btn sm state" data-media="prev" title="Précédent"><span class="ms fill">skip_previous</span></button>
        <button class="icon-btn sm state play" data-media="toggle" title="Lecture/pause"><span class="ms fill">play_arrow</span></button>
        <button class="icon-btn sm state" data-media="next" title="Suivant"><span class="ms fill">skip_next</span></button>
      </div>
      <span class="c-clock"></span>
    </div>
  </div>

  <!-- activite en direct -->
  <div id="activity"></div>

  <!-- panneau deploye -->
  <div id="panel">
    <div class="topbar">
      <div class="tb-time"><b id="tb-clock"></b><span id="tb-date"></span></div>
      <nav id="nav"></nav>
      <div class="tb-actions">
        <button class="icon-btn state" id="btn-settings" title="Réglages"><span class="ms">settings</span></button>
      </div>
    </div>
    <div id="views"></div>
  </div>

  <div id="dropzone">
    <div class="dz" data-dz="shelf"><span class="ms">inventory_2</span><b>Étagère</b><small>Garder sous la main</small></div>
    <div class="dz" data-dz="ai"><span class="ms">local_fire_department</span><b>Demander à Follet</b><small>Lire, résumer, expliquer</small></div>
  </div>
  <div class="snackbar" id="snackbar"></div>
</div>

<script src="js/util.js"></script>
<script src="../i18n/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/mascot.js"></script>
<script src="js/core.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/shelf.js"></script>
<script src="js/views/clip.js"></script>
<script src="js/views/apps.js"></script>
<script src="js/views/term.js"></script>
<script src="js/views/ai.js"></script>
<script src="js/views/power.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
