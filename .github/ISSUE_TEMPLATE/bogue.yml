name: Bogue
description: Quelque chose ne marche pas comme prévu
labels: [bogue]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe
      description: Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire
      placeholder: "1. Ouvrir l'onglet…\n2. Cliquer sur…"
  - type: input
    id: version
    attributes:
      label: Version de Follet
      placeholder: "1.2.0 (Réglages → À propos)"
  - type: textarea
    id: journal
    attributes:
      label: Journal
      description: Les dernières lignes de %APPDATA%\Follet\logs\follet.log, si utile.
      render: text
