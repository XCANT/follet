# Vérification à chaque push et pull request : syntaxe, helper.ps1 en ASCII, versions cohérentes.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js
