# Vérification à chaque push et pull request : syntaxe, helper.ps1 en ASCII, versions cohérentes.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check.js
      - run: node scripts/build-helper.js --force
      - run: node scripts/helper-test.js exe
